<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
    .auth-panel { margin: 24px 0; padding: 20px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    .auth-panel h2 { margin-top: 0; }
    .auth-panel label { display: block; margin: 14px 0 6px; }
    .auth-panel input, .auth-panel textarea { box-sizing: border-box; width: 100%; padding: 12px; border: 1px solid #8296ad; border-radius: 6px; background: #101a28; color: #ecf4ff; font: inherit; }
    .auth-panel button { margin-top: 16px; padding: 12px 20px; border: 0; border-radius: 6px; background: #8ad8df; color: #101a28; font: inherit; cursor: pointer; }
    .auth-panel button:disabled { opacity: .55; cursor: wait; }
    .auth-panel :focus-visible { outline: 3px solid #ffd580; outline-offset: 3px; }
    #notes button { margin: 12px 8px 0 0; padding: 8px 16px; cursor: pointer; }
    #notes span { white-space: pre-wrap; overflow-wrap: anywhere; }
    #note-feedback { white-space: pre-wrap; }
    #auth-error { color: #ffb8c5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 로그인 자료실</div>
    <h1>점령된 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>
    <div class="notice">로그인한 뒤 자료를 볼 수 있습니다. 로그아웃하면 화면의 자료가 지워집니다.</div>
    <section class="auth-panel" aria-labelledby="auth-heading">
      <h2 id="auth-heading">자료실 로그인</h2>
      <p id="auth-status" role="status">로그인 상태 확인 중…</p>
      <form id="login-form">
        <label for="login-email">이메일</label>
        <input id="login-email" name="email" type="email" autocomplete="username" required disabled>
        <label for="login-password">비밀번호</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required disabled>
        <button id="login-button" type="submit" disabled>로그인</button>
      </form>
      <button id="logout-button" type="button" hidden disabled>로그아웃</button>
      <p id="auth-error" role="alert" hidden></p>
    </section>
    <section id="note-editor" class="auth-panel" aria-labelledby="note-heading" hidden>
      <h2 id="note-heading">가상 메모 추가</h2>
      <form id="note-form">
        <label for="note-title">제목</label>
        <input id="note-title" required maxlength="200">
        <label for="note-body">내용 (실습용 가상 자료만 입력)</label>
        <textarea id="note-body" required maxlength="20000" rows="5"></textarea>
        <button id="note-save" type="submit">추가</button>
        <button id="note-cancel" type="button" hidden>수정 취소</button>
      </form>
      <p id="note-feedback" role="status"></p>
    </section>
    <ul id="notes" aria-live="polite"><li>자료를 보려면 로그인해 주세요.</li></ul>
  </main>
  <script type="module">
    const form = document.querySelector('#login-form');
    const email = document.querySelector('#login-email');
    const password = document.querySelector('#login-password');
    const login = document.querySelector('#login-button');
    const logout = document.querySelector('#logout-button');
    const status = document.querySelector('#auth-status');
    const errorBox = document.querySelector('#auth-error');
    const list = document.querySelector('#notes');
    const editor = document.querySelector('#note-editor');
    const noteForm = document.querySelector('#note-form');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const noteSave = document.querySelector('#note-save');
    const noteCancel = document.querySelector('#note-cancel');
    const noteHeading = document.querySelector('#note-heading');
    const noteFeedback = document.querySelector('#note-feedback');
    let activeSession = null;
    let authVersion = 0;
    let editingId = null;
    let writing = false;
    function resetEditor() {
      editingId = null;
      noteForm.reset();
      noteHeading.textContent = '가상 메모 추가';
      noteSave.textContent = '추가';
      noteCancel.hidden = true;
    }
    function writeControls() {
      noteTitle.disabled = noteBody.disabled = noteSave.disabled = noteCancel.disabled = writing;
      list.querySelectorAll('button').forEach(button => { button.disabled = writing; });
    }
    async function writeNote(method, id, payload) {
      if (writing || !activeSession?.access_token) return;
      const version = authVersion;
      writing = true;
      writeControls();
      noteFeedback.textContent = '저장 중…';
      try {
        const response = await fetch(id ? `/api/notes/${encodeURIComponent(id)}` : '/api/notes', {
          method, cache: 'no-store', redirect: 'error',
          headers: { Authorization: `Bearer ${activeSession.access_token}`, 'Content-Type': 'application/json' },
          ...(payload ? { body: JSON.stringify(payload) } : {}),
        });
        if (version !== authVersion) return;
        if (response.status === 401) throw new Error('로그인 확인에 실패했습니다. 다시 로그인해 주세요.');
        if (response.status === 404) throw new Error('메모가 없습니다. 목록을 새로 확인해 주세요.');
        if (response.status === 409) throw new Error('같은 ID의 메모가 이미 있습니다.');
        if (response.status === 400) throw new Error('제목과 내용을 확인해 주세요.');
        if (!response.ok) throw new Error('저장하지 못했습니다. 서버 설정과 DB 변경 SQL 적용 여부를 확인해 주세요.');
        resetEditor();
        noteFeedback.textContent = method === 'DELETE' ? '삭제했습니다.' : '저장했습니다.';
        await loadNotes(activeSession);
      } catch (error) {
        if (version === authVersion) noteFeedback.textContent = error.message;
      } finally {
        writing = false;
        writeControls();
      }
    }
    noteForm.addEventListener('submit', event => {
      event.preventDefault();
      void writeNote(editingId ? 'PUT' : 'POST', editingId, { title: noteTitle.value, body: noteBody.value });
    });
    noteCancel.addEventListener('click', resetEditor);
    let notesRequest;
    let notesVersion = 0;
    function notesMessage(message) {
      const item = document.createElement('li');
      item.textContent = message;
      list.replaceChildren(item);
    }
    async function loadNotes(session) {
      const version = ++notesVersion;
      notesRequest?.abort();
      notesMessage('자료를 보려면 로그인해 주세요.');
      if (!session?.access_token) return;
      const controller = new AbortController();
      notesRequest = controller;
      notesMessage('가상 자료를 불러오는 중입니다.');
      try {
        const response = await fetch('/api/notes', {
          cache: 'no-store', redirect: 'error', signal: controller.signal,
          headers: { Authorization: `Bearer ${session.access_token}` },
        });
        if (version !== notesVersion) return;
        if (response.status === 401) throw new Error('로그인 확인에 실패했습니다. 다시 로그인해 주세요.');
        if (!response.ok) throw new Error('자료를 읽을 수 없습니다. 잠시 후 다시 시도해 주세요.');
        const data = await response.json();
        if (version !== notesVersion) return;
        if (!Array.isArray(data)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!data.length) { notesMessage('내 메모가 없습니다. 첫 가상 메모를 추가해 주세요.'); return; }
        list.replaceChildren(...data.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          title.textContent = note.title;
          content.textContent = note.body;
          const edit = document.createElement('button');
          edit.type = 'button';
          edit.textContent = '수정';
          edit.disabled = writing;
          edit.addEventListener('click', () => {
            if (writing) return;
            editingId = note.id;
            noteTitle.value = note.title;
            noteBody.value = note.body;
            noteHeading.textContent = '가상 메모 수정';
            noteSave.textContent = '수정 저장';
            noteCancel.hidden = false;
            noteFeedback.textContent = '';
            noteTitle.focus();
          });
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.textContent = '삭제';
          remove.disabled = writing;
          remove.addEventListener('click', () => {
            if (!writing && window.confirm('이 가상 메모를 삭제할까요?')) void writeNote('DELETE', note.id);
          });
          item.append(title, content, edit, remove);
          return item;
        }));
      } catch (error) {
        if (version !== notesVersion || controller.signal.aborted) return;
        notesMessage(error.message);
      }
    }
    let client;
    let ready = false;
    let busy = false;
    let signedIn = false;

    function showError(message = '') {
      errorBox.textContent = message;
      errorBox.hidden = !message;
    }
    function updateControls() {
      email.disabled = password.disabled = login.disabled = logout.disabled = !ready || busy;
      login.textContent = busy && !signedIn ? '로그인 중…' : '로그인';
      logout.textContent = busy && signedIn ? '로그아웃 중…' : '로그아웃';
      form.setAttribute('aria-busy', String(busy));
    }
    function renderSession(session) {
      if (activeSession?.user?.id !== session?.user?.id) {
        authVersion++;
        resetEditor();
        noteFeedback.textContent = '';
      }
      activeSession = session;
      editor.hidden = !session?.user;
      signedIn = Boolean(session?.user);
      status.textContent = signedIn ? '로그인됨' : '로그아웃 상태';
      form.hidden = signedIn;
      logout.hidden = !signedIn;
      if (signedIn) form.reset();
      updateControls();
      void loadNotes(session);
    }
    function authError(error) {
      const reasons = {
        invalid_credentials: '이메일 또는 비밀번호가 올바르지 않습니다.',
        email_not_confirmed: '이메일 인증을 완료한 후 로그인해 주세요.',
        user_banned: '로그인이 제한된 계정입니다.',
        over_request_rate_limit: '요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.',
        email_provider_disabled: '이 프로젝트에서 이메일 로그인이 비활성화되어 있습니다.',
      };
      return reasons[error?.code] || error?.message || '연결에 실패했습니다. 네트워크 상태를 확인해 주세요.';
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!ready || busy) return;
      busy = true;
      showError();
      updateControls();
      try {
        const { data, error } = await client.auth.signInWithPassword({
          email: email.value.trim(), password: password.value,
        });
        if (error) throw error;
        renderSession(data.session);
      } catch (error) {
        showError(`로그인 실패: ${authError(error)}`);
      } finally {
        password.value = '';
        busy = false;
        updateControls();
      }
    });
    logout.addEventListener('click', async () => {
      if (!ready || busy) return;
      busy = true;
      showError();
      updateControls();
      try {
        const { error } = await client.auth.signOut({ scope: 'local' });
        if (error) throw error;
        renderSession(null);
      } catch (error) {
        showError(`로그아웃 실패: ${authError(error)}`);
      } finally {
        busy = false;
        updateControls();
      }
    });
    try {
      const { createAuthClient } = await import('./auth-client.js');
      client = createAuthClient();
      client.auth.onAuthStateChange((_event, session) => {
        ready = true;
        renderSession(session);
        showError();
      });
    } catch {
      status.textContent = '로그인을 사용할 수 없습니다.';
      showError('로그인 기능을 시작하지 못했습니다. 네트워크 상태를 확인하고 새로고침해 주세요.');
    }
  </script>

</body>
</html>
